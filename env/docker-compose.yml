# PixelShop training environment
#   docker compose up -d                       -> edge + api-1..3 + redis-a/b
#   docker compose --profile waf up -d         -> + Juice Shop + ModSecurity/CRS (LAB10)
#   docker compose --profile monitoring up -d  -> + Prometheus exporter (LAB07)
#   docker compose --profile tools run --rm hey ...   -> load generator
name: pixelshop

x-api: &api
  image: traefik/whoami:v1.10
  restart: unless-stopped
  networks: [backend]

services:
  edge:
    image: ${EDGE_IMAGE:-nginx:stable}
    container_name: edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"       # HTTP/3 (QUIC)
      - "8080:8080"         # stub_status (LAB07)
      - "6379:6379"         # TCP load balancing (LAB08)
      - "5353:5353/udp"     # UDP load balancing (LAB08 bonus)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
      - ./nginx/modules-enabled:/etc/nginx/modules-enabled:ro
      - ./nginx/njs:/etc/nginx/njs:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - ./www:/srv/www:ro
      - ./logs:/var/log/nginx
      - edge-cache:/var/cache/nginx/edge
    networks: [frontend, backend]

  api-1:
    <<: *api
    environment: { WHOAMI_NAME: api-1 }
  api-2:
    <<: *api
    environment: { WHOAMI_NAME: api-2 }
  api-3:
    <<: *api
    environment: { WHOAMI_NAME: api-3 }

  redis-a:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
  redis-b:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]

  # ---- LAB10: vulnerable app + WAF tier --------------------------------
  juice:
    image: bkimminich/juice-shop:latest
    profiles: [waf]
    networks: [backend]
  waf:
    image: owasp/modsecurity-crs:nginx   # pin a dated tag for production
    profiles: [waf]
    environment:
      BACKEND: http://juice:3000
      PORT: "8080"
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-DetectionOnly}
      BLOCKING_PARANOIA: ${BLOCKING_PARANOIA:-1}
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    volumes:
      - ./waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    networks: [backend]

  # ---- LAB07: metrics ----------------------------------------------------
  exporter:
    image: nginx/nginx-prometheus-exporter:latest   # pin a version for production
    profiles: [monitoring]
    command: ["--nginx.scrape-uri=http://edge:8080/stub_status"]
    ports: ["9113:9113"]
    networks: [backend]

  # ---- tools -----------------------------------------------------------
  hey:
    image: williamyeh/hey:latest
    profiles: [tools]
    network_mode: host

volumes:
  edge-cache:

networks:
  frontend:
  backend:
