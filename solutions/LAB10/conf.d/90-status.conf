# LAB07 - basic metrics endpoint (scraped by nginx-prometheus-exporter)
server {
    listen 8080;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;     # Docker networks
        allow 192.168.0.0/16;
        deny  all;
    }

    location / {
        return 404;
    }
}
