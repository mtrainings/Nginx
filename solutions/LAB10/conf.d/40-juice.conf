# LAB10 - OWASP Juice Shop behind the WAF tier
# start the WAF profile first:  docker compose --profile waf up -d
server {
    listen 80;
    server_name juice.localtest.me nowaf.localtest.me;
    return 301 https://$host$request_uri;
}

# Through the WAF (ModSecurity v3 + OWASP CRS)
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name juice.localtest.me;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        set $waf_upstream http://waf:8080;      # variable => resolved at request time,
        proxy_pass $waf_upstream;               # nginx starts even if the WAF is not running
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Bonus: slow down credential stuffing on the login API
    location = /rest/user/login {
        limit_req zone=login_rl burst=3 nodelay;
        set $waf_upstream http://waf:8080;
        proxy_pass $waf_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

# Direct to the app, NO WAF - for comparison only, never do this in production
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name nowaf.localtest.me;

    location / {
        set $juice_upstream http://juice:3000;
        proxy_pass $juice_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
