# LAB06 - response headers for every HTTPS response.
# Remember: add_header is inherited ONLY if the current level defines no add_header itself,
# so include this snippet again in every location that has its own add_header.
add_header Strict-Transport-Security "max-age=300" always;   # use 31536000 in production
add_header Alt-Svc 'h3=":443"; ma=86400' always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:" always;
