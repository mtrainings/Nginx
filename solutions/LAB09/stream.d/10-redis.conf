# LAB08 - TCP load balancing for Redis
upstream redis_pool {
    zone redis_pool 64k;
    server redis-a:6379 resolve;
    server redis-b:6379 resolve backup;   # step 3: active/passive instead of round robin
}

server {
    listen 6379;
    proxy_pass            redis_pool;
    proxy_connect_timeout 2s;
    proxy_timeout         10m;            # idle timeout for long-lived client connections
}
