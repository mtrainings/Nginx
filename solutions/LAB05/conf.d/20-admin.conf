server {
    listen 80;
    server_name admin.localtest.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name admin.localtest.me;

    root  /srv/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
