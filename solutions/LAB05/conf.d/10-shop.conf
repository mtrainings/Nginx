server {
    listen 80;
    server_name shop.localtest.me www.shop.localtest.me;
    return 301 https://shop.localtest.me$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name shop.localtest.me;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;            # advertise HTTP/3
    add_header Strict-Transport-Security "max-age=300" always;  # short value for the lab!

    root  /srv/www/shop;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "shop OK\n";
    }

    # Fingerprinted build assets: cache "forever", serve pre-compressed .gz if present
    location ^~ /assets/ {
        gzip_static on;
        access_log  off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* \.(png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /docs/ {
        alias /srv/www/docs/;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
