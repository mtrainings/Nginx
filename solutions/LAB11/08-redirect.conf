server {
    listen 80;
    server_name bf8.localtest.me;

    location = /old-path {
        return 301 /new-path;
    }

    location = /new-path {
        default_type text/plain;
        return 200 "new page\n";
    }

    location / {
        default_type text/plain;
        return 200 "home\n";
    }
}
