server {
    listen 80;
    server_name admin.localtest.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name admin.localtest.me;

    include /etc/nginx/snippets/security-headers.conf;

    # Office network OR valid password
    satisfy any;
    allow 10.0.0.0/8;           # e.g. office VPN - adjust to your network
    deny  all;
    auth_basic           "PixelShop Admin";
    auth_basic_user_file /etc/nginx/auth/admin.htpasswd;

    root  /srv/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
