# Bonus: canonical host name
server {
    listen 80;
    server_name www.shop.localtest.me;
    return 301 http://shop.localtest.me$request_uri;
}

server {
    listen 80;
    server_name shop.localtest.me;

    root  /srv/www/shop;
    index index.html;

    location / {
        add_header X-Location "prefix /" always;
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "shop OK\n";
    }

    location ^~ /assets/ {
        add_header X-Location "prefix ^~ /assets/" always;
    }

    location ~* \.(png|jpe?g|gif|svg|ico)$ {
        add_header X-Location "regex images" always;
    }

    location /docs/ {
        alias /srv/www/docs/;
        add_header X-Location "prefix /docs/ (alias)" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
