# LAB04 - on-the-fly compression for text responses
gzip            on;
gzip_comp_level 5;              # 1-9: above ~6 costs CPU for little gain
gzip_min_length 1024;           # tiny responses are not worth compressing
gzip_vary       on;             # "Vary: Accept-Encoding" for caches/CDNs
gzip_proxied    any;            # also compress responses to requests that came via a proxy
gzip_types      text/plain text/css application/javascript application/json
                image/svg+xml application/xml;
