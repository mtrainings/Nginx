# LAB06 - rate limiting zones (state lives in shared memory)
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr zone=login_rl:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;          # default would be 503 - misleading for clients
limit_conn_status 429;

# API keys accepted by the auth_request check
map $http_x_api_key $api_key_valid {
    default            0;
    "pk-training-2026" 1;
}

# Network blocklist (geo is a core module - no database needed)
geo $blocked_net {
    default        0;
    203.0.113.0/24 1;           # TEST-NET-3: pretend this network is abusive
}

client_max_body_size 1m;
