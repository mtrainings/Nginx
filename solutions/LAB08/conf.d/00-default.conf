# Catch-all server: answers requests for host names no other server claims
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 404 "PixelShop edge: no site configured for host '$host'\n";
}

# Unknown SNI on 443: refuse the TLS handshake instead of leaking a certificate
server {
    listen 443 ssl default_server;
    listen 443 quic reuseport default_server;   # reuseport: only ONCE per address:port
    server_name _;
    ssl_reject_handshake on;
}
