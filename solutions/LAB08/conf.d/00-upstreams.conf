# Docker's embedded DNS - lets nginx re-resolve container names at runtime
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    zone api_backend 64k;           # shared memory: state shared by all workers
    # least_conn;                   # try it: route to the instance with fewest active connections
    server api-1:80 resolve max_fails=2 fail_timeout=10s;
    server api-2:80 resolve max_fails=2 fail_timeout=10s;
    server api-3:80 resolve max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8081 backup;   # "sorry" server, used only when all others are down
    keepalive 16;                   # idle keep-alive connections to the backends
}

# Sticky routing: the same X-User always lands on the same instance
upstream api_sticky {
    zone api_sticky 64k;
    hash $http_x_user consistent;
    server api-1:80 resolve;
    server api-2:80 resolve;
    server api-3:80 resolve;
}

# Backup "sorry" server
server {
    listen 127.0.0.1:8081;
    default_type application/json;
    return 503 '{"error":"all api instances are down - please retry later"}\n';
}
