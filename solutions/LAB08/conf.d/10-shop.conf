server {
    listen 80;
    server_name shop.localtest.me www.shop.localtest.me;
    return 301 https://shop.localtest.me$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name shop.localtest.me;

    include /etc/nginx/snippets/security-headers.conf;

    # Trust X-Forwarded-For only from known proxies (here: the Docker networks)
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    if ($blocked_net) {
        return 403;
    }

    root  /srv/www/shop;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "shop OK\n";
    }

    # Fingerprinted build assets: cache "forever", serve pre-compressed .gz if present
    location ^~ /assets/ {
        gzip_static on;
        access_log  off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /docs/ {
        alias /srv/www/docs/;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
