# 308 (not 301) keeps the method and body - important for API clients sending POST
server {
    listen 80;
    server_name api.localtest.me;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name api.localtest.me;

    access_log /var/log/nginx/api.json.log json if=$loggable;
    add_header X-Request-ID $request_id always;

    proxy_connect_timeout 2s;
    proxy_read_timeout    3s;

    location / {
        proxy_pass http://api_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";              # enables upstream keep-alive
        proxy_next_upstream error timeout http_502;   # retry on another instance
        proxy_next_upstream_timeout 10s;              # ...but give up after 10 s in total
        limit_req  zone=api_rl burst=10 nodelay;
        limit_conn perip 20;
    }

    # proxy_pass WITH a URI part: /v1/xyz is sent to the backend as /xyz
    location /v1/ {
        proxy_pass http://api_backend/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # WebSocket endpoint (whoami echoes every message back)
    location /echo {
        proxy_pass http://api_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /sticky/ {
        proxy_pass http://api_sticky;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Cached catalog: 30 s fresh, then served stale while refreshing in the background
    location /catalog/ {
        proxy_pass http://api_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache           api_cache;
        proxy_cache_key       $scheme$host$request_uri;
        proxy_cache_valid     200 30s;
        proxy_cache_valid     404 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock      on;
        proxy_cache_bypass    $http_x_no_cache;
        proxy_no_cache        $http_x_no_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Request-ID   $request_id always;
    }

    # Reports: only with a valid API key (checked by a subrequest)
    location /reports/ {
        auth_request /_auth;
        proxy_pass http://api_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location = /_auth {
        internal;
        if ($api_key_valid = 0) {
            return 401;
        }
        return 204;
    }

    # Brute-force protection for the login endpoint
    location = /login {
        limit_req zone=login_rl burst=3;
        proxy_pass http://api_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Friendly JSON error when no backend answers in time
    error_page 502 504 = @api_down;
    location @api_down {
        default_type application/json;
        return 503 '{"error":"api temporarily unavailable","request_id":"$request_id"}\n';
    }
}
