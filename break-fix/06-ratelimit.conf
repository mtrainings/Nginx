# BF6 - "Customers get '503 Service Temporarily Unavailable' when they click quickly."
#       Expected: normal browsing works (bursts of 10 quick requests),
#       floods are still limited - and limited clients must get 429, not 503
limit_req_zone $binary_remote_addr zone=bf6:1m rate=1r/m;

server {
    listen 80;
    server_name bf6.localtest.me;
    root /srv/www/shop;

    location / {
        limit_req zone=bf6;
        limit_req_status 503;
        try_files /index.html =404;
    }
}
