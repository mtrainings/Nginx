# BF8 - "Browser: ERR_TOO_MANY_REDIRECTS on /old-path."
#       Expected: /old-path redirects ONCE to /new-path, /new-path answers 200 "new page",
#       / answers 200
server {
    listen 80;
    server_name bf8.localtest.me;

    location / {
        rewrite ^ /new-path permanent;
    }

    location /new-path-page {
        default_type text/plain;
        return 200 "new page\n";
    }
}
