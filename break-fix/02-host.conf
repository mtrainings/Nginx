# BF2 - "The application generates links with the host name 'bf2_app'."
#       Expected: the backend receives the host name the client used (bf2.localtest.me)
upstream bf2_app {
    server api-1:80;
}

server {
    listen 80;
    server_name bf2.localtest.me;

    location / {
        proxy_pass http://bf2_app;
    }
}
