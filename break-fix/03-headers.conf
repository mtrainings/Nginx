# BF3 - "Security scan: CSS/JS files are missing X-Content-Type-Options and X-Frame-Options."
#       Expected: the two security headers on EVERY response, Cache-Control on /assets/
server {
    listen 80;
    server_name bf3.localtest.me;
    root /srv/www/shop;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
    }
}
