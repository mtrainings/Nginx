# BF1 - "Product images under /images/ return 404 since the last deploy."
#       Expected: http://bf1.localtest.me/images/logo.svg -> 200 (file: /srv/www/shop/img/logo.svg)
server {
    listen 80;
    server_name bf1.localtest.me;
    root /srv/www/shop;

    location /images/ {
        alias /srv/www/shop/img;
    }
}
